[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imdb-sentiment-lab"
version = "1.0.0"
description = "Reproducible 50K-review sentiment classification course experiment"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.4,<2", "pandas>=2.2,<4", "numpy>=1.26,<3", "matplotlib>=3.8,<4", "requests>=2.31,<3", "beautifulsoup4>=4.12,<5", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sentiment-lab = "sentiment_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
